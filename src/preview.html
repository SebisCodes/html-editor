<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- The frame of the preview. The editor puts the page's elements in here; nothing in it can run a script
     (the frame is sandboxed without allow-scripts, and this policy allows no scripts). Pictures, stylesheets,
     fonts and media come from the page's own files (blob:, data:) or from https:// addresses. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline' https: blob: data:; img-src https: blob: data:; font-src https: blob: data:; media-src https: blob: data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>Preview</title>
</head>
<body></body>
</html>
