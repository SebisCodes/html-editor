<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your order <<orderNumber>></title>
</head>
<body style="font-family:Georgia,serif;color:<<textColor>>">
  <!-- Example values: John Doe, 1 Main Street, 8000 Springfield. <<name>> -->
  <img src="<<logo>>" alt="Logo" width="120">
  <address><<name>><br><<street>><br><<postalCode>> <<city>></address>
  <p>Dear <<name>>,</p>
  <p>thank you for your order. These items are on their way:</p>
  <ul>
    <<?items>><li><<label>>: <<quantity>> pieces</li><</?items>>
  </ul>
  <<?hasTracking>>
  <p><a href="<<trackingLink>>">Track your parcel</a></p>
  <</?hasTracking>>
  <<?withoutTracking>>
  <p>We will send you the tracking link soon.</p>
  <</?withoutTracking>>
  <p class=<<signatureClass>>>Kind regards<br><<senderName>></p>
</body>
</html>
